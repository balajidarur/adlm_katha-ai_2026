### 0.2 s budget bins (26 tokens), else identical to qwen38_bins_frames_full.yaml, 4x L40S
### bins02_f150_40k = the same 7,763 clips / frames as bins_f150_40k, rebinned by dataset/add_bins02.py
model_name_or_path: Qwen/Qwen3.5-4B
trust_remote_code: true
image_max_pixels: 589824        # 448x252 = 112,896 px -> frames never resized
image_min_pixels: 1024
enable_liger_kernel: true       # mandatory: 248k vocab

### the 26 budget-bin tokens (0.2 s grid up to 5 s, then over 5 s)
new_special_tokens_config: examples/budget_ad/bin_tokens_02.yaml
init_special_tokens: desc_init
resize_vocab: false

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: all
freeze_vision_tower: true
additional_target: embed_tokens     # tied lm_head -> required to emit new tokens
restrict_new_token_grad: true       # only the 26 new rows move
special_token_loss_weight: 1.0
budget_variant: none
pure_bf16: true

### dataset
dataset_dir: /scratch/bins02
dataset: bins02_f150_40k
template: qwen3_5_nothink
cutoff_len: 49152
max_samples: 1000000
overwrite_cache: false
tokenized_path: /scratch/tokcache/qwen38_bins02_f150_40k
preprocessing_num_workers: 48
dataloader_num_workers: 8

### output
output_dir: /scratch/runs/qwen38_bins02_frames_full
logging_steps: 5
save_steps: 20
save_total_limit: 12
plot_loss: true
overwrite_output_dir: false
report_to: wandb
run_name: qwen38-bins02-frames-full-4xl40s

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8     # 1 x 8 x 4 GPUs = effective batch 32
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true       # required at this context length
train_sampling_strategy: group_by_length
save_only_model: false             # keeps optimizer state -> resumable
ddp_timeout: 180000000
ddp_find_unused_parameters: false

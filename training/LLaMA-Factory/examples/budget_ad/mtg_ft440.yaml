### MTG fine-tune (T5): M3 recipe, initialised from the CMD-AD M3 checkpoint-440 adapter (new run, not a resume)
### data: mtg_bins_f250 (279 MTG validation videos, 1 FPS gap frames cap 250, Piper GT durations -> budget bins)
model_name_or_path: Qwen/Qwen3.5-4B
adapter_name_or_path: /scratch/ckpt/qwen38-dd_budget_ckpt440   # CMD-AD M3 ckpt-440 LoRA (+embed copy): trained further, fresh optimizer/scheduler
trust_remote_code: true
image_max_pixels: 589824        # 448x252 = 112,896 px -> frames never resized
image_min_pixels: 1024
enable_liger_kernel: true       # mandatory: 248k vocab

### the 9 budget-bin tokens
new_special_tokens_config: examples/budget_ad/bin_tokens.yaml
init_special_tokens: desc_init
resize_vocab: false

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: all
freeze_vision_tower: true
additional_target: embed_tokens     # tied lm_head -> required to emit new tokens
restrict_new_token_grad: true       # only the 9 new rows move
special_token_loss_weight: 1.0
budget_variant: none
pure_bf16: true

### dataset
dataset_dir: /scratch/mtg/ds
dataset: mtg_bins_f250_train
template: qwen3_5_nothink
cutoff_len: 65536
max_samples: 1000000
overwrite_cache: false
tokenized_path: /scratch/tokcache/mtg_bins_f250_train
preprocessing_num_workers: 48
dataloader_num_workers: 8

### output
output_dir: /scratch/runs/mtg_ft440
logging_steps: 5
save_steps: 17                     # half epoch (34 steps/epoch: 269 videos, effective batch 8); 3 epochs = step 102
save_total_limit: null
plot_loss: true
overwrite_output_dir: false
report_to: none
run_name: mtg-ft-from-cmdad440

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 2     # 1 x 2 x 4 GPUs = effective batch 8 (279 train videos)
learning_rate: 1.0e-4
num_train_epochs: 5.0                # cosine over 5 epochs; stopped at 3 epochs (STOP_AT)
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true       # required at this context length
train_sampling_strategy: group_by_length
save_only_model: false             # keeps optimizer state -> resumable
ddp_timeout: 180000000
ddp_find_unused_parameters: false

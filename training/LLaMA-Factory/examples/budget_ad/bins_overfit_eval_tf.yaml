### model
model_name_or_path: Qwen/Qwen3.5-4B
adapter_name_or_path: /data/cmd_ad/runs/bins_overfit/checkpoint-30
trust_remote_code: true
flash_attn: fa2
new_special_tokens_config: examples/budget_ad/bin_tokens.yaml
init_special_tokens: desc_init
resize_vocab: false

### method
stage: sft
do_predict: true
finetuning_type: lora
budget_variant: none
budget_teacher_forced: true
budget_prefill_chunk: 2048

### dataset — same 16 clips we overfit on
eval_dataset: ad_bins_overfit
template: qwen
cutoff_len: 17408
overwrite_cache: true

### output
output_dir: /data/cmd_ad/runs/bins_overfit/pred_tf
overwrite_output_dir: true
report_to: none
per_device_eval_batch_size: 1
bf16: true

### Qwen3.8-27B dense: identical to nobudget_frames_full.yaml but with Qwen3.8 dense descriptions, 4x L40S
### 7,843 clips | 690,145 frames | 77,048 AD lines | 695,474 budget tokens
model_name_or_path: Qwen/Qwen3.5-4B
trust_remote_code: true
image_max_pixels: 589824        # 448x252 = 112,896 px -> frames never resized
image_min_pixels: 1024
enable_liger_kernel: true       # mandatory: 248k vocab

resize_vocab: false

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: all
freeze_vision_tower: true
budget_variant: none
pure_bf16: true

### dataset
dataset_dir: /data/cmd_ad/datasets/frame_variants_448x252_full_qwen38/nobudget
dataset: nobudget_f150_40k
template: qwen3_5_nothink
cutoff_len: 49152
max_samples: 1000000
overwrite_cache: false
tokenized_path: /data/cmd_ad/tokcache/qwen38_nobudget_f150_40k
preprocessing_num_workers: 48
dataloader_num_workers: 8

### output
output_dir: /data/cmd_ad/runs/qwen38_nobudget_frames_full
logging_steps: 5
save_steps: 20
save_total_limit: 12
plot_loss: true
overwrite_output_dir: false
report_to: wandb
run_name: qwen38-nobudget-frames-full-4xl40s

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8     # 1 x 8 x 4 GPUs = effective batch 32
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true       # required at this context length
train_sampling_strategy: group_by_length
save_only_model: false             # keeps optimizer state -> resumable
ddp_timeout: 180000000
ddp_find_unused_parameters: false

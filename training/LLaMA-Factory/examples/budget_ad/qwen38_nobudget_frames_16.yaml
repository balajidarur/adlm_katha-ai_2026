### 1-clip overfit: gap frames + dense text + budget-bin tokens
### vision settings copied verbatim from configs/exp3_dds_gapframes_4b.yaml
model_name_or_path: Qwen/Qwen3.5-4B
trust_remote_code: true
image_max_pixels: 589824        # 448x252 = 112,896 px -> frames are never resized
image_min_pixels: 1024
enable_liger_kernel: true

### the 9 budget-bin tokens
resize_vocab: false

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: all
freeze_vision_tower: true
budget_variant: none                # no duration head
pure_bf16: true

### dataset
dataset_dir: /data/cmd_ad/datasets/frame_variants_448x252_full_qwen38/nobudget
dataset: nobudget_16
template: qwen3_5_nothink
cutoff_len: 49152
overwrite_cache: true
preprocessing_num_workers: 4

### output
output_dir: /data/cmd_ad/runs/qwen38_nobudget_frames_16
logging_steps: 8
save_steps: 48
plot_loss: true
overwrite_output_dir: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-4
num_train_epochs: 15.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000

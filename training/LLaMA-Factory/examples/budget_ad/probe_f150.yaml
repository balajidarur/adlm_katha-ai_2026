### Full CMD-AD run: gap frames + dense text + budget-bin tokens, 4x L40S
### 7,843 clips | 690,145 frames | 77,048 AD lines | 695,474 budget tokens
model_name_or_path: Qwen/Qwen3.5-4B
trust_remote_code: true
image_max_pixels: 589824        # 448x252 = 112,896 px -> frames never resized
image_min_pixels: 1024
enable_liger_kernel: true       # mandatory: 248k vocab

### the 9 budget-bin tokens
new_special_tokens_config: examples/budget_ad/bin_tokens.yaml
init_special_tokens: desc_init
resize_vocab: false

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: all
freeze_vision_tower: true
additional_target: embed_tokens     # tied lm_head -> required to emit new tokens
restrict_new_token_grad: true       # only the 9 new rows move
special_token_loss_weight: 1.0
budget_variant: none
pure_bf16: true

### dataset
dataset_dir: /data/cmd_ad/datasets/bins_frames
dataset: top20_f150
template: qwen3_5_nothink
cutoff_len: 49152
max_samples: 1000000
overwrite_cache: false
tokenized_path: /data/cmd_ad/tokcache/probe_f150
preprocessing_num_workers: 48
dataloader_num_workers: 8

### output
output_dir: /data/cmd_ad/runs/probe_f150
logging_steps: 1
save_steps: 10000
save_total_limit: 12
plot_loss: true
overwrite_output_dir: true
report_to: none
run_name: bins-frames-full-4xl40s

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8     # 1 x 8 x 4 GPUs = effective batch 32
learning_rate: 1.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true       # required at this context length
train_sampling_strategy: group_by_length
save_only_model: false             # keeps optimizer state -> resumable
ddp_timeout: 180000000
ddp_find_unused_parameters: false

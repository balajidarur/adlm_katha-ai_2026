### REFRAMED NO-BUDGET: same data/recipe as reframed_qwen38_bins_frames.yaml minus the budget legend/tokens
### (as CMD-AD qwen38_nobudget_frames_full.yaml vs qwen38_bins_frames_full.yaml)
model_name_or_path: Qwen/Qwen3.5-4B
trust_remote_code: true
image_max_pixels: 589824        # 448x252 = 112,896 px -> frames never resized
image_min_pixels: 1024
enable_liger_kernel: true       # mandatory: 248k vocab

resize_vocab: false

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: all
freeze_vision_tower: true
budget_variant: none
pure_bf16: true

### dataset
dataset_dir: /scratch/rf_datasets/frame_variants_448x252
dataset: reframed_nobudget_f150_40k_train
template: qwen3_5_nothink
cutoff_len: 49152
max_samples: 1000000
overwrite_cache: false
tokenized_path: /scratch/tokcache/reframed_nobudget_f150_40k
preprocessing_num_workers: 48
dataloader_num_workers: 8

### output
output_dir: /scratch/runs/reframed_qwen38_nobudget_frames
logging_steps: 5
save_strategy: steps
save_steps: 54                     # quarter epoch (217 steps/epoch at effective batch 8)
save_total_limit: 20
plot_loss: true
overwrite_output_dir: false
report_to: wandb
run_name: reframed-qwen38-nobudget-frames-4xl40s

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 2     # 1 x 2 x 4 GPUs = effective batch 8 -> 217 steps/epoch (CMD-AD: 243)
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true       # required at this context length
train_sampling_strategy: group_by_length
save_only_model: false             # keeps optimizer state -> resumable
ddp_timeout: 180000000
ddp_find_unused_parameters: false

# ADLM Dense Description Pipeline Configuration
# Dataset: CMD-AD  |  Model: Gemini 3.5 Flash Lite
#
# Used by:
#   batch_round_pipeline.py  — full dataset round-based pipeline
#   test_adlm_descriptions.py — single-video interactive runner
#
# Override any value via CLI:
#   python3 test_adlm_descriptions.py model.name=gemma-4-26b-a4b-it
#   python3 test_adlm_descriptions.py model.provider=local model.name=google/gemma-4-E2B-it
#   python3 test_adlm_descriptions.py pipeline.num_shots=5 model.temperature=0.3

model:
  # Provider: "api" (Google Gemini API) or "local" (HuggingFace on GPU)
  provider: api
  name: gemini-3.5-flash-lite
  temperature: 0.2

  # Local-only settings (ignored when provider=api)
  local:
    dtype: bfloat16
    device_map: auto
    max_new_tokens: 8192

# CMD-AD dataset paths
data:
  cmd_ad_csv: /storage/datasets/CMD-AD/data/cmd_ad_anno_v1.csv
  cmd_video_base: /storage/datasets/CMD/data/videos
  cmd_ad_splits_dir: /storage/datasets/CMD-AD/data/splits
  asr_srt_dir: cmd_ad_asr
  gt_ad_srts: /workspace/.common_cache/common_share_for_users/srt_for_ads/datasets/cmd_ad/srt_ads
  whisperx_asr: /workspace/.common_cache/common_share_for_users/srt_for_ads/datasets/cmd_ad/whisperx_ASR_subtitles/SRT

# Single-video test mode (used by test_adlm_descriptions.py)
video:
  path: /home/dbalu/workspace/ad_gen/multi_language/srt_for_ads/pipeline/output/rotary_3min/rotary_3min.mp4
  dialogue_srt: /home/dbalu/workspace/ad_gen/multi_language/srt_for_ads/pipeline/output/rotary_3min/rotary_3min.srt

pipeline:
  context_fps: 1
  target_fps: 3
  scene_threshold: 0.12
  num_shots: 0              # 0 = all
  max_frames: 80            # max total frames per API call (target + context combined)
  max_shot_duration: 10.0   # seconds — shots longer than this are split
  min_shot_duration: 3.0    # seconds — target minimum shot duration
  shot_duration_tolerance: 0.3  # seconds — shots within +/-tolerance of min are kept as-is
  shot_absorb_threshold: 1.0   # seconds — orphan shots shorter than this get absorbed by neighbor
  frame_height: 480

output:
  dir: output

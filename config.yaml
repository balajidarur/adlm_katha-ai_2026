# ADLM Dense Description Pipeline Configuration
#
# Override any value via CLI:
#   python3 test_adlm_descriptions.py model.name=gemma-4-26b-a4b-it
#   python3 test_adlm_descriptions.py model.provider=local model.name=google/gemma-4-E2B-it
#   python3 test_adlm_descriptions.py pipeline.num_shots=5 model.temperature=0.3

model:
  # Provider: "api" (Google API for Gemini + Gemma) or "local" (HuggingFace on GPU)
  provider: api
  # Model name:
  #   API Gemini:  gemini-3.1-pro-preview, gemini-3-flash-preview, gemini-3.1-flash-lite, ...
  #   API Gemma:   gemma-4-26b-a4b-it, gemma-4-31b-it
  #   Local Gemma: google/gemma-4-E2B-it, google/gemma-4-E4B-it, google/gemma-4-12B-it, ...
  name: gemini-3.1-pro-preview
  temperature: 0.2

  # Local-only settings (ignored when provider=api)
  local:
    dtype: bfloat16         # float16, bfloat16, float32
    device_map: auto        # auto, cuda:0, cuda:1, etc.
    max_new_tokens: 8192

video:
  path: output/rotary_3min/rotary_3min.mp4
  dialogue_srt: output/rotary_3min/rotary_3min.srt

pipeline:
  context_fps: 1
  target_fps: 3
  scene_threshold: 0.12
  num_shots: 0              # 0 = all
  frame_height: 480

output:
  dir: /tmp/adlm_dense_descriptions/output
